<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial &amp; Admin Console Access — Reason Press</title>
<meta name="description" content="Restricted administrative portal for Reason Press editorial staff and console operators.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="styles.css">
<style>
  body.admin-auth-body {
    background: #0B1120;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #F8FAFC;
    font-family: var(--font-sans);
    margin: 0;
  }

  .admin-auth-header {
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .admin-auth-card-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .admin-auth-card {
    background: #111827;
    border: 1px solid #1F2937;
    border-radius: 8px;
    max-width: 440px;
    width: 100%;
    padding: 40px 36px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }

  .admin-auth-icon {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: #38BDF8;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
  }

  .admin-auth-title {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    color: #F8FAFC;
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }

  .admin-auth-subtitle {
    font-size: 13px;
    color: #94A3B8;
    text-align: center;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .admin-alert {
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 20px;
    display: none;
    line-height: 1.5;
  }

  .admin-alert--error {
    background: rgba(239, 68, 68, 0.12);
    color: #FCA5A5;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .admin-alert--success {
    background: rgba(34, 197, 94, 0.12);
    color: #86EFAC;
    border: 1px solid rgba(34, 197, 94, 0.3);
  }

  .admin-form-field {
    margin-bottom: 18px;
  }

  .admin-form-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #CBD5E1;
    margin-bottom: 8px;
  }

  .admin-form-input {
    width: 100%;
    padding: 12px 14px;
    background: #0B1120;
    border: 1px solid #334155;
    border-radius: 6px;
    color: #F8FAFC;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .admin-form-input:focus {
    border-color: #38BDF8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
  }

  .admin-form-input::placeholder {
    color: #475569;
  }

  .admin-btn-primary {
    width: 100%;
    padding: 13px 20px;
    background: #2563EB;
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
  }

  .admin-btn-primary:hover {
    background: #1D4ED8;
  }

  .admin-btn-primary:active {
    transform: translateY(1px);
  }

  .admin-btn-google {
    width: 100%;
    padding: 11px 18px;
    background: rgba(255, 255, 255, 0.05);
    color: #E2E8F0;
    border: 1px solid #334155;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s, border-color 0.2s;
    margin-bottom: 16px;
  }

  .admin-btn-google:hover {
    background: rgba(255, 255, 255, 0.09);
    border-color: #475569;
  }

  .admin-auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .admin-auth-divider-line {
    flex: 1;
    height: 1px;
    background: #1F2937;
  }

  .admin-auth-divider-text {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #64748B;
  }

  .admin-auth-footer {
    padding: 20px 32px;
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 12px;
    color: #64748B;
  }
</style>
</head>
<body class="admin-auth-body">

<header class="admin-auth-header">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#FFFFFF;">
    <img src="assets/favicon.png" alt="Reason Press" style="height:28px;">
    <span style="font-family:var(--font-sans);font-weight:700;font-size:1.15rem;letter-spacing:-0.02em;">Reason Press</span>
  </a>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="background:#B45309;color:#FEF3C7;font-size:10px;font-weight:700;letter-spacing:0.08em;padding:4px 9px;border-radius:4px;text-transform:uppercase;">Admin Security Gateway</span>
    <a href="index.html" style="color:#94A3B8;text-decoration:none;font-size:12px;margin-left:8px;">&larr; Public Store</a>
  </div>
</header>

<main class="admin-auth-card-wrap">
  <div class="admin-auth-card">
    <div class="admin-auth-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="admin-auth-title">Console Access</h1>
    <p class="admin-auth-subtitle">
      Sign in to manage books, categories, submissions, orders, and customer messages.
    </p>

    <div id="admin-login-alert" class="admin-alert"></div>

    <!-- Direct Credentials Form: ADMIN / 1234 -->
    <form id="admin-direct-form" onsubmit="event.preventDefault(); handleMasterAdminLogin();">
      <div class="admin-form-field">
        <label class="admin-form-label" for="admin-user-id">Administrator Username</label>
        <input class="admin-form-input" type="text" id="admin-user-id" placeholder="ADMIN" required autocomplete="username" autofocus>
      </div>

      <div class="admin-form-field">
        <label class="admin-form-label" for="admin-pass">Access Password</label>
        <div style="position:relative;">
          <input class="admin-form-input" type="password" id="admin-pass" placeholder="••••" required autocomplete="current-password" style="padding-right:40px;">
          <button type="button" onclick="toggleAdminPassVisibility()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94A3B8;cursor:pointer;padding:4px;" aria-label="Toggle password view">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="admin-btn-primary" id="btn-admin-submit">
        <span>Authenticate &amp; Enter Console</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="admin-auth-divider">
      <div class="admin-auth-divider-line"></div>
      <span class="admin-auth-divider-text">or authenticate with google</span>
      <div class="admin-auth-divider-line"></div>
    </div>

    <button type="button" class="admin-btn-google" onclick="handleGoogleAdminLogin()">
      <svg width="17" height="17" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.02h3.87c2.26-2.09 3.67-5.17 3.67-9.12z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3.02c-1.08.72-2.45 1.16-4.06 1.16-3.13 0-5.78-2.11-6.73-4.96H1.28v3.11C3.26 21.3 7.36 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.62H1.28C.46 8.24 0 10.06 0 12s.46 3.76 1.28 5.38l3.99-3.11z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.7 1.28 6.62l3.99 3.11c.95-2.85 3.6-4.98 6.73-4.98z"/>
      </svg>
      <span>Sign In with Google Account</span>
    </button>

    <div style="text-align:center;margin-top:12px;">
      <a href="login.html" style="font-size:12px;color:#94A3B8;text-decoration:none;">Go to Reader Account Sign In &rarr;</a>
    </div>
  </div>
</main>

<footer class="admin-auth-footer">
  &copy; 2026 Reason Press . Caliph &bull; Editorial Operations Desk &bull; Strictly Confidential
</footer>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-service.js?v=2.3"></script>

<script>
  function showAlert(msg, type = "error") {
    const el = document.getElementById("admin-login-alert");
    if (!el) return;
    el.className = "admin-alert admin-alert--" + type;
    el.textContent = msg;
    el.style.display = "block";
  }

  function clearAlert() {
    const el = document.getElementById("admin-login-alert");
    if (el) el.style.display = "none";
  }

  function toggleAdminPassVisibility() {
    const passInput = document.getElementById("admin-pass");
    if (passInput) {
      passInput.type = passInput.type === "password" ? "text" : "password";
    }
  }

  async function handleMasterAdminLogin() {
    clearAlert();
    const userVal = (document.getElementById("admin-user-id").value || "").trim();
    const passVal = (document.getElementById("admin-pass").value || "").trim();
    const submitBtn = document.getElementById("btn-admin-submit");

    if (!userVal || !passVal) {
      showAlert("Please enter both administrator username and access password.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = "<span>Authenticating clearance...</span>";

    // Master Administrator Verification (User: ADMIN, Pass: 1234)
    if (userVal.toUpperCase() === "ADMIN" && passVal === "1234") {
      const adminProfile = {
        uid: "admin_master",
        id: "admin_master",
        name: "Master Administrator",
        email: "admin@reasonpress.com",
        role: "admin",
        accountStatus: "active",
        emailVerified: true
      };

      sessionStorage.setItem("rp_admin_logged_in", "true");
      localStorage.setItem("rp_current_user", JSON.stringify(adminProfile));

      // Record in Firestore if online
      if (typeof FirebaseService !== "undefined" && FirebaseService.logActivity) {
        FirebaseService.logActivity({
          type: "admin",
          action: "Master Console Authenticated",
          details: "Master Admin logged into Editorial Console via credential key.",
          targetEmail: "admin@reasonpress.com"
        }).catch(() => {});
      }

      showAlert("✓ Access Granted. Loading Editorial Console...", "success");
      setTimeout(() => {
        window.location.href = "admin.html";
      }, 350);
      return;
    }

    // Also support registered email + password logins
    if (userVal.includes("@") && typeof FirebaseService !== "undefined") {
      try {
        const { user, profile } = await FirebaseService.loginUser(userVal, passVal);
        sessionStorage.setItem("rp_admin_logged_in", "true");
        showAlert(`✓ Welcome, ${profile?.name || user.email}! Opening console...`, "success");
        setTimeout(() => { window.location.href = "admin.html"; }, 350);
        return;
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "<span>Authenticate &amp; Enter Console</span>";
        showAlert("Invalid credentials: " + (err.message || "Please check username and password."));
        return;
      }
    }

    submitBtn.disabled = false;
    submitBtn.innerHTML = "<span>Authenticate &amp; Enter Console</span>";
    showAlert("Invalid administrative credentials. Expected Username: ADMIN and configured Access Key.");
  }

  async function handleGoogleAdminLogin() {
    clearAlert();
    try {
      if (typeof FirebaseService === "undefined") {
        throw new Error("Firebase Service is loading. Please try again.");
      }
      const { user, profile } = await FirebaseService.loginWithGoogle();
      sessionStorage.setItem("rp_admin_logged_in", "true");
      
      // Auto promote to admin if not yet
      if (FirebaseService.setUserRole && user?.uid) {
        await FirebaseService.setUserRole(user.uid, "admin").catch(() => {});
      }

      showAlert(`✓ Welcome, ${profile?.name || user.displayName || user.email}! Opening console...`, "success");
      setTimeout(() => { window.location.href = "admin.html"; }, 350);
    } catch (err) {
      console.warn("Google admin sign in notice:", err);
      if (err.code === "auth/popup-closed-by-user") return;
      showAlert("Google sign-in error: " + (err.message || "Could not complete sign in."));
    }
  }
</script>
</body>
</html>
